{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agentic-data-kernel.fullname" . }}-api
  labels:
    {{- include "agentic-data-kernel.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "agentic-data-kernel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
