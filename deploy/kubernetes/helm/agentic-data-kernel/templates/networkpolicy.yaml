{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic-data-kernel.fullname" . }}
  labels:
    {{- include "agentic-data-kernel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic-data-kernel.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.networkPolicy.ingressFrom }}
  ingress:
    - {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - port: 4318
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
