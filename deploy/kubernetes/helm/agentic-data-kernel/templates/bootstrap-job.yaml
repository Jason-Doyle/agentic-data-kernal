apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentic-data-kernel.fullname" . }}-bootstrap
  labels:
    {{- include "agentic-data-kernel.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.jobs.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.jobs.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "agentic-data-kernel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.jobs.serviceAccountName | quote }}
      automountServiceAccountToken: {{ .Values.jobs.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      {{- if .Values.databaseProxy.enabled }}
      initContainers:
        - name: database-proxy
          restartPolicy: Always
          image: {{ .Values.databaseProxy.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            {{- toYaml .Values.databaseProxy.args | nindent 12 }}
          ports:
            - name: database-proxy
              containerPort: {{ .Values.databaseProxy.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.databaseProxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
        - name: database-proxy-ready
          image: {{ .Values.databaseProxy.waitImage | quote }}
          command:
            - sh
            - -ec
            - for attempt in $(seq 1 60); do nc -z 127.0.0.1 {{ .Values.databaseProxy.port }} && exit 0; sleep 2; done; exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ include "agentic-data-kernel.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - dist/production/cli.js
            - bootstrap-role
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.adminName }}
                  key: MIGRATION_DATABASE_URL
            - name: APP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.adminName }}
                  key: APP_DATABASE_PASSWORD
            - name: DATABASE_CA_CERT_BASE64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.adminName }}
                  key: DATABASE_CA_CERT_BASE64
                  optional: true
            - name: DATABASE_SSL
              value: {{ .Values.config.databaseSsl | quote }}
            - name: DATABASE_STATEMENT_TIMEOUT_MS
              value: {{ .Values.config.databaseStatementTimeoutMs | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
