name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/jason-doyle/agentic-data-kernel

jobs:
  package:
    name: Validate release package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@12.0.2
      - run: npm ci
      - name: Validate release tag
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
      - run: npm run release:check
      - name: Create npm artifact
        run: |
          mkdir release-artifacts
          npm pack --json --pack-destination release-artifacts
          cd release-artifacts
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  npm:
    name: Publish npm package
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@12.0.2
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release-artifacts
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "agentic-data-kernel@$VERSION" version --json >/dev/null 2>&1; then
            echo "agentic-data-kernel@$VERSION is already published"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          npm publish ./release-artifacts/*.tgz \
            --access public \
            --provenance \
            --tag "$DIST_TAG"

  container:
    name: Publish production container
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=next,enable=${{ contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Agentic Data Kernel
            org.opencontainers.image.description=Temporal knowledge and durable workflow infrastructure for software agents
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  github:
    name: Create GitHub release
    needs:
      - npm
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release-artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_ARGS=(
            release create "$GITHUB_REF_NAME"
            release-artifacts/*.tgz
            release-artifacts/SHA256SUMS
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "Agentic Data Kernel $VERSION"
          )
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          else
            RELEASE_ARGS+=(--latest)
          fi
          gh "${RELEASE_ARGS[@]}"
